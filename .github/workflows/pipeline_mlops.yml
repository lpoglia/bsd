# Workflow ÚNICO do pipeline MLOps (Trabalho N3).
# Uma execução agendada aciona todo o fluxo, em sequência, num só job:
#   estado persistente -> 01 ETL/drift -> 02 votação -> 03 treino A/B
#   -> 04 eleição/promoção/SHAP -> 05 previsões -> evidências -> persistência
# Qualquer falha interrompe o job: os passos seguintes (inclusive o commit do
# novo estado) não rodam, então nenhuma promoção indevida é persistida.
name: pipeline_mlops

on:
  schedule:
    # 09:17 e 21:17 UTC (06:17 e 18:17 em Brasília). Minuto "quebrado" para
    # fugir do pico de agendamentos do GitHub, que pode atrasar execuções.
    - cron: "17 9,21 * * *"
  workflow_dispatch: {}          # execução manual apenas para depuração

permissions:
  contents: write                # necessário para commitar o estado persistente

concurrency:                     # nunca duas execuções simultâneas do pipeline
  group: pipeline-mlops
  cancel-in-progress: false

defaults:
  run:
    shell: bash                  # bash -eo pipefail: qualquer erro interrompe

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      MLFLOW_DISABLE_AGENT_HINT: "1"
      NB: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=1800 --output-dir evidencias/_execucao_atual

    steps:
      # 1-2. Obtém código, dados (data/raw) e o ESTADO PERSISTENTE versionado no
      # repositório: mlflow.db, mlartifacts/, models/ (manifesto + modelos) e evidencias/.
      - name: Checkout (código + dados + estado persistente)
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar requirements
        run: python -m pip install -r requirements.txt

      - name: Estado recuperado do ciclo anterior
        run: |
          echo "Gatilho: ${{ github.event_name }}"
          echo "--- models/estado_pipeline.json"; cat models/estado_pipeline.json 2>/dev/null || echo "(primeira execução)"
          echo "--- models/modelo_vigente.json";  cat models/modelo_vigente.json  2>/dev/null || echo "(sem modelo vigente)"
          mkdir -p evidencias/_execucao_atual

      # 3. ETL, validação, engenharia de atributos e monitoramento de drift
      - name: 01 - ETL e drift
        run: $NB notebooks/01_etl.ipynb --output 01_etl_executado.ipynb

      # 4-5. Três métodos de seleção + votação
      - name: 02 - Votação de features
        run: $NB notebooks/02_votacao_features.ipynb --output 02_votacao_features_executado.ipynb

      # 6. Modelo A (Ridge) x Modelo B (RandomForest) com as mesmas features
      - name: 03 - Treino e competição
        run: $NB notebooks/03_treino_competicao.ipynb --output 03_treino_competicao_executado.ipynb

      # 7-9. Eleição, confronto com o vigente, regra de promoção, SHAP, manifesto
      - name: 04 - Seleção e promoção
        run: $NB notebooks/04_selecao_promocao.ipynb --output 04_selecao_promocao_executado.ipynb

      # 10. Previsões com o modelo vigente + teste integrado + comparação de ciclos
      - name: 05 - Previsões
        run: $NB notebooks/05_previsoes.ipynb --output 05_previsoes_executado.ipynb

      - name: Organizar evidências do ciclo
        id: ciclo
        run: python scripts/finalizar_ciclo.py

      # Persistência: commit automático do novo estado (só chega aqui se tudo passou)
      - name: Persistir estado no repositório
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlflow.db mlartifacts models evidencias
          git commit -m "MLOps ${{ steps.ciclo.outputs.cycle_id }} (${{ steps.ciclo.outputs.data_version }}): ${{ steps.ciclo.outputs.decisao }} [gatilho: ${{ github.event_name }}, run ${{ github.run_id }}] [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Pacote completo de resultados como artifact baixável (também em caso de falha, para depuração)
      - name: Publicar pacote de resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-${{ steps.ciclo.outputs.cycle_id || 'falha' }}-run${{ github.run_id }}
          path: |
            mlflow.db
            mlartifacts/
            models/
            evidencias/
            data/processed/ciclo_atual.json
          retention-days: 90
          if-no-files-found: warn
